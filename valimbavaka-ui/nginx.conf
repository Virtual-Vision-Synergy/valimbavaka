server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pas de version de nginx dans les en-tetes.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API : relayee vers le conteneur backend. La resolution DNS dynamique (resolver Docker +
    # variable) evite qu'nginx garde une ancienne IP quand le conteneur core est recree.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://core:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Fichiers avec hash dans le nom (outputHashing: all) : cache long.
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html jamais en cache : une nouvelle release est visible immediatement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routes Angular (SPA) : tout le reste retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
