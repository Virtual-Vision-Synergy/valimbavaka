<figure class="chart">
  <figcaption class="legend" aria-hidden="true">
    <span class="key current">{{ currentLabel() }}</span>
    <span class="key previous">{{ previousLabel() }}</span>
  </figcaption>
  <div class="scroll">
    <div class="plot" aria-hidden="true" [style.min-width.px]="points().length * 28 + 56">
      <div class="axis">
        @for (tick of ticks(); track tick.ratio) {
          <span class="tick" [style.bottom.%]="tick.ratio">{{ tick.label }}</span>
        }
      </div>
      <div class="area">
        @for (tick of ticks(); track tick.ratio) {
          <span class="gridline" [style.bottom.%]="tick.ratio"></span>
        }
        @for (point of points(); track point.label) {
          <div class="column" [class.today]="point.today">
            <div class="pair">
              <span class="bar previous" [style.height.%]="percent(point.previous)"></span>
              <span class="bar current" [style.height.%]="percent(point.current)"></span>
            </div>
            <span class="label">{{ point.label }}</span>
          </div>
        }
      </div>
    </div>
  </div>
  <table class="sr-only">
    <caption>
      {{
        caption()
      }}
    </caption>
    <thead>
      <tr>
        <th scope="col">{{ 'reports.chart.day' | translate }}</th>
        <th scope="col">{{ currentLabel() }}</th>
        <th scope="col">{{ previousLabel() }}</th>
      </tr>
    </thead>
    <tbody>
      @for (point of points(); track point.label) {
        <tr>
          <th scope="row">{{ point.label }}</th>
          <td>{{ format(point.current) }}</td>
          <td>{{ format(point.previous) }}</td>
        </tr>
      }
    </tbody>
  </table>
</figure>
