<main class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <img class="logo" src="logo/logo-min.png" alt="" width="56" height="56" />
    <h1>{{ 'auth.login.title' | translate }}</h1>

    @if (errorMessage(); as message) {
      <div class="alert alert-danger" role="alert">{{ message }}</div>
    }

    <div class="field">
      <label for="email">{{ 'auth.login.email' | translate }}</label>
      <input
        id="email"
        class="input"
        type="email"
        formControlName="email"
        autocomplete="username"
        aria-describedby="email-error"
      />
      @if (hasError('email')) {
        <span id="email-error" class="field-error" aria-live="polite">
          {{ 'auth.login.emailInvalid' | translate }}
        </span>
      }
    </div>

    <div class="field">
      <label for="password">{{ 'auth.login.password' | translate }}</label>
      <input
        id="password"
        class="input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        aria-describedby="password-error"
      />
      @if (hasError('password')) {
        <span id="password-error" class="field-error" aria-live="polite">
          {{ 'auth.login.passwordRequired' | translate }}
        </span>
      }
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
      {{ (isSubmitting() ? 'auth.login.submitting' : 'auth.login.submit') | translate }}
    </button>

    <vvs-language-switcher />
  </form>
</main>
