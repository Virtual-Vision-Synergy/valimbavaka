@for (node of vvsIcon(); track $index) {
  @let a = node[1];
  @switch (node[0]) {
    @case ('path') {
      <svg:path [attr.d]="a['d']" />
    }
    @case ('circle') {
      <svg:circle [attr.cx]="a['cx']" [attr.cy]="a['cy']" [attr.r]="a['r']" />
    }
    @case ('ellipse') {
      <svg:ellipse
        [attr.cx]="a['cx']"
        [attr.cy]="a['cy']"
        [attr.rx]="a['rx']"
        [attr.ry]="a['ry']"
      />
    }
    @case ('rect') {
      <svg:rect
        [attr.x]="a['x']"
        [attr.y]="a['y']"
        [attr.width]="a['width']"
        [attr.height]="a['height']"
        [attr.rx]="a['rx']"
        [attr.ry]="a['ry']"
      />
    }
    @case ('line') {
      <svg:line [attr.x1]="a['x1']" [attr.y1]="a['y1']" [attr.x2]="a['x2']" [attr.y2]="a['y2']" />
    }
    @case ('polyline') {
      <svg:polyline [attr.points]="a['points']" />
    }
    @case ('polygon') {
      <svg:polygon [attr.points]="a['points']" />
    }
  }
}
