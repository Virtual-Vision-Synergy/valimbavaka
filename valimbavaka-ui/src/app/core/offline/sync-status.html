<div class="sync-status" role="status">
  @if (!isOnline()) {
    <p class="badge offline">{{ 'sync.offline' | translate }}</p>
  }
  @if (pendingCount() > 0) {
    <a class="badge" routerLink="/synchronisation">{{
      'sync.pending' | translate: { count: pendingCount() }
    }}</a>
  }
  @if (failedCount() > 0) {
    <a class="badge failed" routerLink="/synchronisation">{{
      'sync.failed' | translate: { count: failedCount() }
    }}</a>
  }
</div>
