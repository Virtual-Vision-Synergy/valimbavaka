name: Convention VVS

# Vérifie chaque PR contre la convention VVS V2.1 (resources/convention-dev-VVS-V2.1.pdf, §12).
# Chaque écart est annoté sur la ligne concernée avec son niveau de la grille §15 :
#   P0 (error)   -> le job échoue, la PR est bloquée
#   P1 (warning) -> à corriger avant la fusion, ne bloque pas
#   P2 (notice)  -> suggestion
# Le formatage (Spotless, Prettier) ne contrôle que les fichiers modifiés par la PR (ratchet) :
# l'existant n'est jamais bloquant tant qu'on n'y touche pas.
# Build, tests et ArchUnit restent dans ci.yml.

on:
  pull_request:
    branches: [develop, main]
    # edited : le titre et le corps de la PR sont contrôlés aussi.
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: conventions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_REF: origin/${{ github.base_ref || 'develop' }}

jobs:
  backend:
    name: Backend (Spotless, Checkstyle)
    # Une simple modification du titre ou du corps de la PR ne relance pas l'analyse du code.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # Historique complet : Spotless compare avec origin/develop (ratchetFrom).
          fetch-depth: 0

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: valimbavaka-core/pom.xml

      - name: Formatage (Spotless, fichiers modifiés)
        working-directory: valimbavaka-core
        run: mvn -B -ntp spotless:check

      - name: Checkstyle
        if: ${{ !cancelled() }}
        working-directory: valimbavaka-core
        run: mvn -B -ntp checkstyle:check -Dcheckstyle.skip=false -Dcheckstyle.failOnViolation=false

      - name: Annotations P0/P1/P2
        if: ${{ !cancelled() }}
        run: >
          python3 .github/scripts/annotate_findings.py --title "Backend — Checkstyle"
          --checkstyle valimbavaka-core/target/checkstyle-result.xml

  frontend:
    name: Frontend (Prettier, ESLint)
    # Une simple modification du titre ou du corps de la PR ne relance pas l'analyse du code.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: valimbavaka-ui/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: valimbavaka-ui

      - name: Formatage (Prettier, fichiers modifiés)
        working-directory: valimbavaka-ui
        run: |
          git diff --name-only --relative --diff-filter=ACMR "$BASE_REF...HEAD" > changed-files.txt
          if [ -s changed-files.txt ]; then
            xargs --delimiter='\n' npx prettier --check --ignore-unknown < changed-files.txt
          fi

      - name: ESLint
        if: ${{ !cancelled() }}
        working-directory: valimbavaka-ui
        # Le code de sortie est porté par l'étape d'annotations (P0 = échec).
        run: npx eslint . --format json --output-file eslint-report.json || true

      - name: Annotations P0/P1/P2
        if: ${{ !cancelled() }}
        run: >
          python3 .github/scripts/annotate_findings.py --title "Frontend — ESLint"
          --eslint valimbavaka-ui/eslint-report.json

  pull-request:
    name: PR, commits et migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Titre, corps, branche, commits, taille, Liquibase
        # Passés par l'environnement, jamais interpolés dans le script (injection).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 .github/scripts/check_conventions.py --base "$BASE_REF" --head HEAD

  secrets:
    name: Secrets (gitleaks)
    # Une simple modification du titre ou du corps de la PR ne relance pas l'analyse du code.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      # Binaire officiel plutôt que gitleaks-action, qui exige une licence pour les dépôts d'organisation.
      - name: Installation de gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks

      - name: Aucun secret dans les commits de la PR
        run: ./gitleaks git --log-opts="$BASE_REF..HEAD" --redact --no-banner --exit-code 1
