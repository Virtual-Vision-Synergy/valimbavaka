name: CI

# Verifie chaque PR (et chaque release, via images.yml) : le code compile, les tests et ArchUnit
# passent (le reste de la convention : conventions.yml). Les tests d'integration backend (*IT) tournent sur un vrai
# PostgreSQL 16 via Testcontainers, la meme version que sur l'EliteBook (jamais H2).

on:
  pull_request:
    branches: [develop, main]
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL est demarre par Testcontainers (Docker est disponible sur ubuntu-latest).
    defaults:
      run:
        working-directory: valimbavaka-core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: valimbavaka-core/pom.xml

      # Checkstyle, Spotless et le lint sont dans conventions.yml (annotations P0/P1/P2).
      - name: Compilation, tests et ArchUnit (mvn verify)
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: valimbavaka-ui
    steps:
      - uses: actions/checkout@v5

      # Angular 22 exige Node >= 22.22.3 ou >= 24.15 : on suit la ligne 24 (LTS).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: valimbavaka-ui/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx ng test --watch=false

      - name: Build production
        run: npm run build

      - name: Lighthouse (page de connexion, build de production)
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json
