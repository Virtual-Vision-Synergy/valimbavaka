# --- Profil "test" (tests d'integration) ---
# La connexion reelle est fournie par Testcontainers (@ServiceConnection) : ces valeurs ne servent
# qu'a resoudre les placeholders du socle commun, elles ne sont jamais utilisees pour se connecter.
DB_HOST=unused
DB_PORT=5432
DB_NAME=unused
DB_USERNAME=unused
DB_PASSWORD=unused

# Premier administrateur cree au demarrage du contexte de test (base vierge a chaque conteneur).
vvs.bootstrap.admin.email=Admin.Test@Valimbavaka.mg
vvs.bootstrap.admin.password=mot-de-passe-de-test-tres-long
vvs.bootstrap.admin.first-name=Rasoa
vvs.bootstrap.admin.last-name=Rakoto

# Secret JWT aleatoire par execution de tests (aucun secret versionne) ; cookie sans Secure.
vvs.jwt.secret=${random.uuid}${random.uuid}
vvs.auth.refresh-cookie-secure=false

# Les ITs se connectent en rafale depuis la meme IP : plafonds releves (le test dedie les abaisse).
vvs.rate-limit.login-per-ip=1000
vvs.rate-limit.login-per-identifier=1000
