# --- Profil "staging" (placeholder) ---
# Comme "prod" : pas de datasource redefini ici, DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/
# DB_PASSWORD sont de vraies variables d'environnement du systeme (pas de .env), deja geres
# par le socle commun d'application.properties. Fail-fast si l'une d'elles manque.
# A completer avec la config propre a l'environnement de staging (pool de connexions, etc.).

# Contrairement a "prod" : on garde le SQL formate et logge en DEBUG, utile pour deboguer
# avant une mise en prod, sans le cout que ca aurait en prod.

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
