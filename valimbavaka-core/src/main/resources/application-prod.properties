# --- Profil "prod" (placeholder) ---
# A completer quand un environnement de prod/staging reel existe (pool de connexions
# HikariCP, niveaux de logs, etc.). Le datasource n'a pas besoin d'etre redefini ici :
# DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD y seront de vraies variables
# d'environnement du systeme (pas de .env en prod), et le socle commun d'application.properties
# les utilise deja. Si l'une d'elles manque, le demarrage echoue explicitement (fail-fast) :
# c'est voulu, pas de fallback silencieux vers localhost en prod.

# Pas de SQL formate/verbeux en prod (par opposition au profil "local").

spring.jpa.properties.hibernate.format_sql=false

# Contrat OpenAPI et Swagger UI fermes en production (convention 7.7)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
