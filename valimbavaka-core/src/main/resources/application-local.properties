# --- Profil "local" (dev sur poste, actif par defaut) ---
# Complements/surcharges specifiques au developpement local par-dessus application.properties.
# Le datasource n'est pas redefini ici : le socle commun (application.properties) compose deja
# l'URL depuis DB_HOST/DB_PORT/..., et ton .env personnel (non committe) fournit tes propres
# valeurs (ex: DB_PORT=5433 si ton Postgres natif occupe deja le 5432).

# Affiche le SQL genere par Hibernate, formate lisiblement -> confort de debug en dev,
# bruit inutile (et cout) en prod, donc pas dans le socle commun.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
