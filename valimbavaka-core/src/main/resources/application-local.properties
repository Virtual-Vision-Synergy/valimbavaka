# --- Profil "local" (dev sur poste, actif par defaut) ---
# Complements/surcharges specifiques au developpement local par-dessus application.properties.
# Ici (et seulement ici) le datasource a des valeurs par defaut : PostgreSQL natif (WSL) sur
# localhost:5432, l'appli demarre donc sans .env. Ton .env personnel (non committe) ou de vraies
# variables d'environnement restent prioritaires (ex: DB_PORT=5433 pour la base Docker,
# DB_HOST=postgres dans le conteneur core). staging/prod gardent le fail-fast du socle commun.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:valimbavaka}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Secret JWT de dev uniquement (base locale jetable) ; surchargeable via JWT_SECRET. Cookie sans Secure (http).
vvs.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
vvs.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

# Premier administrateur de dev (base locale jetable uniquement). Surchargeable via .env.
vvs.bootstrap.admin.email=${ADMIN_EMAIL:admin@valimbavaka.mg}
vvs.bootstrap.admin.password=${ADMIN_PASSWORD:admin-local-a-changer}
vvs.bootstrap.admin.first-name=${ADMIN_FIRST_NAME:Admin}
vvs.bootstrap.admin.last-name=${ADMIN_LAST_NAME:Local}

# Affiche le SQL genere par Hibernate, formate lisiblement -> confort de debug en dev,
# bruit inutile (et cout) en prod, donc pas dans le socle commun.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
