spring.application.name=valimbavaka-core

spring.profiles.active=local

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Pas de valeurs par defaut ici : DB_HOST/DB_PORT/... doivent etre fournies (par .env en
# local, par de vraies variables d'environnement en staging/prod), sinon le demarrage
# echoue explicitement au lieu de retomber silencieusement sur localhost en prod.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Web ---
# Origines CORS explicites (liste separee par des virgules), jamais "*".
vvs.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Premier administrateur (SYS-05) ---
# Lu uniquement si aucun administrateur n'existe en base : le compte est alors cree et devra
# changer son mot de passe a la premiere connexion. Valeurs fournies par l'environnement
# (.env en local), jamais ecrites ici. Base sans admin + variables absentes = demarrage refuse.
vvs.bootstrap.admin.email=${ADMIN_EMAIL:}
vvs.bootstrap.admin.password=${ADMIN_PASSWORD:}
vvs.bootstrap.admin.first-name=${ADMIN_FIRST_NAME:}
vvs.bootstrap.admin.last-name=${ADMIN_LAST_NAME:}

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- Actuator (health check du deploiement) ---
# Seul /actuator/health est expose : le script de deploiement et le HEALTHCHECK Docker l'appellent
# depuis l'interieur du conteneur. nginx ne le publie pas (seul /api/ est proxifie).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
