spring.application.name=valimbavaka-core

spring.profiles.active=local

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Pas de valeurs par defaut ici : DB_HOST/DB_PORT/... doivent etre fournies (par .env en
# local, par de vraies variables d'environnement en staging/prod), sinon le demarrage
# echoue explicitement au lieu de retomber silencieusement sur localhost en prod.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml