spring.application.name=valimbavaka-core

spring.profiles.active=local

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Pas de valeurs par defaut ici : DB_HOST/DB_PORT/... doivent etre fournies (par .env en
# local, par de vraies variables d'environnement en staging/prod), sinon le demarrage
# echoue explicitement au lieu de retomber silencieusement sur localhost en prod.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- Actuator (health check du deploiement) ---
# Seul /actuator/health est expose : le script de deploiement et le HEALTHCHECK Docker l'appellent
# depuis l'interieur du conteneur. nginx ne le publie pas (seul /api/ est proxifie).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# --- Administrateur initial (SYS-05) ---
# Lu uniquement quand la base ne contient aucun administrateur : le compte est alors cree avec
# changement de mot de passe obligatoire. Base sans admin + variables absentes = demarrage refuse.
# Jamais de valeur ici : ADMIN_* viennent du .env (local) ou de l'environnement (staging/prod).
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${ADMIN_FIRST_NAME:}
app.bootstrap.admin.last-name=${ADMIN_LAST_NAME:}
